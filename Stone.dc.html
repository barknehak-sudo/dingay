</div>

const NAMES={cobble:'Cobblestone specimen',blocket:'Concrete block specimen',river:'River stone specimen',foundation:'Foundation stone specimen',opal:'Opal specimen',choc:'Chocolate opal specimen',emerald:'Emerald specimen',diamond:'Diamond specimen'};

/* ---------- 3D ---------- */
const TV='0.170.0';
let LIB=null;
const lib=()=>LIB||(LIB=Promise.all([import(`https://esm.sh/three@${TV}`),import(`https://esm.sh/three@${TV}/examples/jsm/environments/RoomEnvironment.js`)]).then(([T,R])=>({T,Room:R.RoomEnvironment})));
const h3=(x,y,z)=>{let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1274126177);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;};

const ROCK={
  cobble:{cube:.55,s:[1.12,.8,.95],big:.24,fine:.05,crack:.05,seed:3,tex:'assets/tex-rock.png',rep:[2,1],color:'#d6d2ca',rough:.88,bump:3},
  foundation:{cube:.82,s:[1.38,.72,.9],big:.14,fine:.07,crack:.07,seed:11,tex:'assets/tex-rock.png',rep:[3,1.5],color:'#e3cfb0',rough:.95,bump:4},
  river:{cube:.08,s:[1.25,.52,.92],big:.08,fine:.006,crack:0,seed:5,tex:'assets/tex-rock.png',rep:[1.5,1],color:'#a9bcc9',rough:.32,bump:.6,coat:.8}
};
function rockGeo(T,c){

  for(let i=0;i<n;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);const m=Math.max(Math.abs(x),Math.abs(y),Math.abs(z))||1;
    x=x*(1-c.cube)+x/m*c.cube*.8;y=y*(1-c.cube)+y/m*c.cube*.8;z=z*(1-c.cube)+z/m*c.cube*.8;

function ringsGeo(T,rings,segs,sx,sz){

  for(let k=0;k<rings.length-1;k++)for(let i=0;i<segs;i++){const a=pt(rings[k],i),b=pt(rings[k],i+1),c=pt(rings[k+1],i),d=pt(rings[k+1],i+1);tri(a,b,c);tri(b,d,c);}

function rr(path,x,y,w,h,r){path.moveTo(x+r,y);path.lineTo(x+w-r,y);path.quadraticCurveTo(x+w,y,x+w,y+r);path.lineTo(x+w,y+h-r);path.quadraticCurveTo(x+w,y+h,x+w-r,y+h);path.lineTo(x+r,y+h);path.quadraticCurveTo(x,y+h,x,y+h-r);path.lineTo(x,y+r);path.quadraticCurveTo(x,y,x+r,y);}
function blocketGeo(T){

const texCache={};
let maxAniso=8;

    for(let i=0;i<p.count;i++){let y=p.getY(i);y=y>0?y*.52:y*.18;p.setXYZ(i,p.getX(i)*1.05,y,p.getZ(i)*.78);}geo.computeVertexNormals();

const PITCH={blocket:.5,emerald:.5,diamond:.5};
/* reads the centre pixels straight after a render: catches GPUs that "succeed" but draw nothing or pure black */

/* ---------- stills ----------
   One shared renderer photographs each kind once. Small stones, the certificate and the
   downloaded certificate use these pictures, so they look 3D without a WebGL context each. */
const SHOT_PX=640,shots={};let shotR=null,shotQ=Promise.resolve();
function shot(kind){
  kind=K[kind]?kind:'cobble';
  if(/[?&]nogl\b/.test(location.search))return Promise.resolve(null);
  return shots[kind]||(shots[kind]=(shotQ=shotQ.then(async()=>{
    try{
      const{T,Room}=await lib();
      if(!shotR){shotR=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});shotR.setPixelRatio(1);shotR.setSize(SHOT_PX,SHOT_PX,false);
        shotR.toneMapping=T.ACESFilmicToneMapping;shotR.toneMappingExposure=1.05;shotR.outputColorSpace=T.SRGBColorSpace;maxAniso=shotR.capabilities.getMaxAnisotropy();}
      const{scene,cam,envT}=stage(T,Room,shotR);const mesh=buildMesh(T,kind);const grp=new T.Group();grp.add(mesh);scene.add(grp);
      await Promise.race([mesh.userData.ready,new Promise(r=>setTimeout(r,6000))]);
      grp.rotation.set(PITCH[kind]||.25,.7,0);
      const ok=renderChecked(T,shotR,scene,cam,mesh,kind)>=0;
      const url=ok?shotR.domElement.toDataURL('image/png'):null;
      mesh.geometry.dispose();mesh.material.dispose();envT.dispose();
      return url;
    }catch(e){return null;}
  })));
}
window.dgStoneShot=shot;
