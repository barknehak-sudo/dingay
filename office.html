<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DINGUY Orders</title>
<style>
:root{--bg:#e6ecef;--card:#f3f5f6;--ink:#0b1720;--mut:#435f73;--line:rgba(11,23,32,.16);--ok:#1f8a55;--warn:#b7791f;--bad:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,'Noto Sans Ethiopic',sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit;touch-action:manipulation}
.wrap{max-width:900px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
h1{margin:6px 0 18px;font-size:40px;letter-spacing:-.04em;line-height:.95}
.login{display:flex;gap:8px}
input{height:48px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:0;font-size:16px;flex:1;min-width:0}
.btn{min-height:44px;padding:0 16px;border:0;background:var(--ink);color:#e6ecef;font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.bad{background:var(--bad)}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 12px}
.tabs button{min-height:44px;padding:0 14px;border:1px solid var(--ink);background:transparent;cursor:pointer;font-size:13px}
.tabs button[aria-pressed=true]{background:var(--ink);color:#e6ecef}
.card{background:var(--card);border:1px solid var(--line);padding:14px;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.big{font-size:20px;font-weight:600;letter-spacing:-.02em}
.pill{display:inline-block;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#fff}
.s-paid{background:var(--ok)}.s-removed{background:#444}.s-review{background:var(--warn)}.s-rejected{background:var(--bad)}.s-awaiting{background:#6f8797}
dl{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin:10px 0 0;font-size:14px}
dt{color:var(--mut)}dd{margin:0;overflow-wrap:anywhere}
.reason{margin-top:8px;padding:8px 10px;background:#fff4e0;border-left:3px solid var(--warn);font-size:14px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
details.new{margin-top:16px;background:var(--card);border:1px solid var(--line);padding:0 14px}
details.new summary{min-height:52px;display:flex;align-items:center;font-weight:700;letter-spacing:.06em;font-size:13px;cursor:pointer;list-style:none}
details.new summary::-webkit-details-marker{display:none}
.f{display:grid;gap:10px;padding:4px 0 16px}.f label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.f select,.f textarea{font:inherit;font-size:16px;min-height:48px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:0}
.f textarea{padding:10px 12px;min-height:80px;resize:vertical}.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.done{margin-top:10px;padding:12px;background:#e6f4ec;border-left:3px solid var(--ok);font-size:14px}
a{color:inherit}
.err{color:var(--bad);margin-top:10px;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <div class="mono">DINGUY Registration Office · Staff only</div>
  <h1>ORDERS</h1>
  <form class="login" id="login">
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <button class="btn" type="submit">OPEN</button>
  </form>
  <div class="err" id="err"></div>
  <div id="app" hidden>
    <div class="row"><span class="mono" id="count"></span><button class="btn ghost" id="refresh">REFRESH</button></div>
    <details class="new" id="newreg"><summary>+ NEW REGISTRATION (ADD BY HAND)</summary>
      <form class="f" id="newform">
        <label>Stone<select name="slug" required><option value="">Choose…</option><option value="cobblestone">COBBLESTONE · 89</option><option value="bloket">ብሎኬት · 89</option><option value="river-stone">የወንዝ ድንጋይ · 89</option><option value="foundation-stone">መሰረት ድንጋይ · 89</option><option value="queen-of-sheba">THE QUEEN OF SHEBA · 199</option><option value="mezezo-chocolate-opal">MEZEZO CHOCOLATE OPAL · 199</option><option value="shakiso-emerald">SHAKISO EMERALD · 199</option><option value="diamond">DIAMOND · 199</option></select></label>
        <div class="two"><label>For (recipient)<input name="to" required maxlength="28"></label><label>From (buyer)<input name="by" required maxlength="28"></label></div>
        <label>Occasion<select name="occasion"><option value="">—</option><option>Birthday</option><option>Anniversary</option><option>Graduation</option><option>Farewell</option><option>Apology</option><option>Just because</option></select></label>
        <label>Message<textarea name="message" maxlength="140"></textarea></label>
        <div class="two"><label>Buyer phone (optional)<input name="phone" type="tel" inputmode="tel" placeholder="09XX XXX XXX"></label><label>Recipient email (optional)<input name="email" type="email"></label></div>
        <div class="two"><label>Language<select name="lang"><option value="en">English</option><option value="am">አማርኛ</option></select></label><label>Payment note (optional)<input name="note" maxlength="60" placeholder="e.g. cash, DJ…"></label></div>
        <button class="btn" type="submit">REGISTER — MARK AS PAID</button>
        <div id="newdone"></div>
      </form>
    </details>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pw='';try{pw=sessionStorage.getItem('dg-admin')||''}catch(e){}
let orders=[],inquiries=[],tab='review';
const TABS=[['review','Needs review'],['paid','Paid'],['awaiting','Awaiting payment'],['rejected','Rejected'],['removed','Removed'],['all','All orders'],['inq','SIDEWAYS inquiries']];
async function api(method,body){
  const r=await fetch('/api/admin',{method,headers:{'x-admin-password':pw,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:'Bad response'}));if(!r.ok)throw new Error(j.error||r.status);return j;
}
async function load(){
  $('#err').textContent='';
  try{const j=await api('GET');orders=j.orders;inquiries=j.inquiries||[];try{sessionStorage.setItem('dg-admin',pw)}catch(e){}$('#login').hidden=true;$('#app').hidden=false;render();}
  catch(e){$('#err').textContent=e.message;$('#login').hidden=false;$('#app').hidden=true;}
}
const PAYNUM='0996567218';
function msgs(o){
  const am=o.lang==='am';
  const help=am
    ?`ሰላም ${o.by}፣ ከDINGUY ነው 👋 ለ${o.to} ያዘዙት ${o.name} ክፍያ እየጠበቀ ነው።\n1) ቴሌብርን ይክፈቱ → Send Money\n2) ${o.price} ብር ወደ ${PAYNUM} (Din) ይላኩ\n3) ከደረሰኙ ላይ የግብይት ቁጥሩን (Transaction Number) ይቅዱ\n4) እዚህ ያስገቡት፦ ${o.payLink}\nጥያቄ ካለዎት፦ ${PAYNUM}`
    :`Hi ${o.by}, this is DINGUY 👋 Your ${o.name} for ${o.to} is waiting for payment.\n1) Open telebirr → Send Money\n2) Send ${o.price} Birr to ${PAYNUM} (Din)\n3) Copy the Transaction Number from the receipt\n4) Paste it here: ${o.payLink}\nQuestions? Call ${PAYNUM}`;
  const congrats=am
    ?`እንኳን ደስ አለዎት ${o.by}! 🎉 ${o.to} በይፋ በ${o.name} ተመዝግቧል። የምዝገባ ቁ. ${o.id}። ይመልከቱና ሰርተፊኬቱን ያስቀምጡ፦ ${o.recordLink} — DINGUY`
    :`Congratulations ${o.by}! 🎉 ${o.to} is now officially registered with ${o.name}. Registration No. ${o.id}. See it and save the certificate: ${o.recordLink} — DINGUY`;
  const subject=am?`${o.to}፣ በስምዎ ድንጋይ ተመዝግቧል`:`${o.to}, a stone has been registered in your name`;
  const body=am
    ?`ሰላም ${o.to}፣\n\n${o.by} በDINGUY መዝገብ ውስጥ ${o.name}ን በስምዎ አስመዝግበዋል።\n\n${o.message?`“${o.message}”\n\n`:''}የምዝገባ ቁ. ${o.id}\nመዝገብዎና ሰርተፊኬትዎ፦ ${o.recordLink}\n\nDINGUY® — ከልክ በላይ ትርጉም ላላቸው አጋጣሚዎች የተመዘገቡ ድንጋዮች።\nዲጂታል ምዝገባ። አካላዊ ድንጋይ አይካተትም።`
    :`Hi ${o.to},\n\n${o.by} has registered ${o.name} in your name with the DINGUY Registry.\n\n${o.message?`“${o.message}”\n\n`:''}Registration No. ${o.id}\nYour record and certificate: ${o.recordLink}\n\nDINGUY® — Registered stones for unreasonably meaningful occasions.\nDigital registration. No physical stone included.`;
  return {help,congrats,subject,body};
}
const sms=(phone,body)=>'sms:'+phone+'?&body='+encodeURIComponent(body);
function contactButtons(o){
  if(!o.phone&&!o.email)return '';
  const m=msgs(o),b=[];
  if(o.phone){
    b.push(`<a class="btn ghost" href="tel:${esc(o.phone)}">CALL</a>`);
    if(o.status==='paid')b.push(`<a class="btn" href="${esc(sms(o.phone,m.congrats))}">SMS: CONGRATS</a>`);
    else if(o.status!=='removed')b.push(`<a class="btn" href="${esc(sms(o.phone,m.help))}">SMS: PAYMENT HELP</a>`);
  }
  if(o.email&&o.status==='paid')b.push(`<a class="btn" href="mailto:${esc(o.email)}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}">EMAIL ${esc(o.to).toUpperCase()}</a>`);
  return `<div class="actions">${b.join('')}</div>`;
}
function when(ms){return ms?new Date(ms).toLocaleString('en-GB',{timeZone:'Africa/Addis_Ababa',dateStyle:'medium',timeStyle:'short'}):'—'}
function render(){
  const n=k=>k==='inq'?inquiries.filter(q=>q.status!=='done').length:k==='all'?orders.length:orders.filter(o=>o.status===k).length;
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" aria-pressed="${k===tab}">${l} (${n(k)})</button>`).join('');
  $('#count').textContent=orders.length+' latest orders';
  if(tab==='inq'){renderInq();return;}
  const list=orders.filter(o=>tab==='all'||o.status===tab);
  $('#list').innerHTML=list.length?list.map(o=>`
    <div class="card">
      <div class="row"><span class="big">${esc(o.id)}</span><span class="pill s-${esc(o.status)}">${esc(o.status.toUpperCase())}</span></div>
      <dl>
        <dt>Stone</dt><dd>${esc(o.name)} · ${esc(o.price)} Birr</dd>
        <dt>For</dt><dd>${esc(o.to)} (from ${esc(o.by)})</dd>
        <dt>Ordered</dt><dd>${when(o.createdAt)}${o.lang==='am'?' · አማርኛ':''}</dd>
        ${o.phone?`<dt>Buyer phone</dt><dd><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></dd>`:''}
        ${o.email?`<dt>Their email</dt><dd>${esc(o.email)}</dd>`:''}
        <dt>Transaction</dt><dd>${o.txn?`<a href="https://transactioninfo.ethiotelecom.et/receipt/${encodeURIComponent(o.txn)}" target="_blank" rel="noopener noreferrer">${esc(o.txn)} ↗</a>`:'—'}</dd>
        ${o.payer?`<dt>Paid by</dt><dd>${esc(o.payer)}</dd>`:''}
        ${o.paidAmount!=null?`<dt>Amount</dt><dd>${esc(o.paidAmount)} Birr · ${when(o.paidAt)}</dd>`:''}
        ${o.approvedBy?`<dt>Approved</dt><dd>${esc(o.approvedBy)} · ${when(o.approvedAt)}</dd>`:''}
      </dl>
      ${o.reason&&o.status==='review'?`<div class="reason">${esc(o.reason)}</div>`:''}
      ${o.status==='review'||o.status==='awaiting'||o.status==='rejected'?`<div class="actions">
        <button class="btn" data-a="approve" data-id="${esc(o.id)}">APPROVE</button>
        ${o.status!=='rejected'?`<button class="btn bad" data-a="reject" data-id="${esc(o.id)}">REJECT</button>`:''}
      </div>`:''}
      ${contactButtons(o)}
      ${o.status==='removed'?`<div class="actions"><button class="btn" data-a="restore" data-id="${esc(o.id)}">RESTORE TO REGISTRY</button></div>`:''}
      ${o.status==='paid'?`<div class="actions"><button class="btn ghost" data-a="remove" data-id="${esc(o.id)}">REMOVE FROM PUBLIC REGISTRY</button></div>`:''}
    </div>`).join(''):'<p class="mono" style="margin-top:20px">Nothing here.</p>';
}
function reachLink(r){const t=String(r||'').trim();if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t))return `<a href="mailto:${esc(t)}">${esc(t)}</a>`;const d=t.replace(/[^\d+]/g,'');return d.length>=9?`<a href="tel:${esc(d)}">${esc(t)}</a>`:esc(t);}
function renderInq(){
  $('#list').innerHTML=inquiries.length?inquiries.map(q=>`
    <div class="card" style="${q.status==='done'?'opacity:.55':''}">
      <div class="row"><span class="big">${esc(q.name)}</span><span class="pill ${q.status==='done'?'s-awaiting':'s-review'}">${q.status==='done'?'DONE':'NEW'}</span></div>
      <dl>
        <dt>Contact</dt><dd>${reachLink(q.reach)}</dd>
        <dt>Needs</dt><dd>${esc(q.need)}</dd>
        <dt>Received</dt><dd>${when(q.createdAt)}</dd>
      </dl>
      ${q.msg?`<p style="margin:10px 0 0;white-space:pre-wrap;font-size:15px;line-height:1.45">${esc(q.msg)}</p>`:''}
      <div class="actions"><button class="btn ${q.status==='done'?'ghost':''}" data-q="${esc(q.id)}" data-qa="${q.status==='done'?'new':'done'}">${q.status==='done'?'MARK AS NEW':'MARK AS DONE'}</button></div>
    </div>`).join(''):'<p class="mono" style="margin-top:20px">No inquiries yet.</p>';
}
$('#login').onsubmit=e=>{e.preventDefault();pw=$('#pw').value;load();};
$('#refresh').onclick=load;
$('#newform').onsubmit=async e=>{
  e.preventDefault();const f=e.target,btn=f.querySelector('button[type=submit]');
  const create=Object.fromEntries(new FormData(f).entries());
  if(!confirm(`Register ${create.to} (from ${create.by}) as PAID and publish it?`))return;
  btn.disabled=true;$('#newdone').innerHTML='';
  try{const j=await api('POST',{create});const o=j.order;orders=[o,...orders];render();f.reset();
    $('#newdone').innerHTML=`<div class="done"><strong>${esc(o.id)}</strong> registered for ${esc(o.to)}. <a href="${esc(o.recordLink)}" target="_blank" rel="noopener">Open record ↗</a>${contactButtons(o)}</div>`;}
  catch(err){$('#newdone').innerHTML=`<div class="err">${esc(err.message)}</div>`;}
  btn.disabled=false;
};
$('#tabs').onclick=e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();}};
$('#list').onclick=async e=>{
  const qb=e.target.closest('[data-q]');
  if(qb){qb.disabled=true;try{const j=await api('POST',{inquiry:qb.dataset.q,action:qb.dataset.qa});inquiries=inquiries.map(q=>q.id===j.inquiry.id?j.inquiry:q);render();}catch(err){alert(err.message);qb.disabled=false;}return;}
  const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.id,a=b.dataset.a;
  let note=null;
  if(a==='restore'&&!confirm(`Put ${id} back in the public registry? Its number and certificate link work again.`))return;
  if(a==='remove'&&!confirm(`Remove ${id} from the public registry? Its registry page and certificate stop working. This can't be undone.`))return;
  if(a==='approve'&&!confirm(`Approve ${id}? The customer can then download the certificate.`))return;
  if(a==='reject'){note=prompt(`Reject ${id}. Message shown to the customer (optional):`,'We could not confirm this payment. Please contact us.');if(note===null)return;}
  b.disabled=true;
  try{const j=await api('POST',{id,action:a,note});orders=orders.map(o=>o.id===id?j.order:o);render();}catch(err){alert(err.message);b.disabled=false;}
};
if(pw)load();
setInterval(()=>{if(!$('#app').hidden)load()},60000);
</script>
</body>
</html>
