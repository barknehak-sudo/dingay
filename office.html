<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f4f1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>DINGUY Office</title>
<style>
:root{
  color-scheme:light;
  --bg:#e8e8e5;--panel:#f4f4f1;--card:#ffffff;--card-2:#f4f4f1;--ink:#141414;--ink-2:#4f4f4b;--mut:#8b8b86;--line:rgba(20,20,20,.08);
  --brand:#141414;--on-brand:#ffffff;--accent:#f05a28;--accent-2:#ff8f5e;--accent-bg:#fde9e1;
  --tele:#1c1c1a;--jami:#f05a28;--jami-2:#ff8a5c;
  --series-1:#1c1c1a;--series-2:#f05a28;--track:rgba(20,20,20,.06);
  --ok:#1e8a50;--ok-bg:#e3f4ea;--warn:#a96a00;--warn-bg:#fdf1d8;--bad:#c4321f;--bad-bg:#fde6e2;--info-bg:#e9eef7;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 8px 24px -16px rgba(20,20,20,.18);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0b0b0b;--panel:#121212;--card:#1b1b1a;--card-2:#232322;--ink:#f3f3f0;--ink-2:#c2c2bc;--mut:#8d8d88;--line:rgba(255,255,255,.08);
    --brand:#f3f3f0;--on-brand:#141414;--accent:#ff6a33;--accent-2:#ff9a6b;--accent-bg:rgba(255,106,51,.14);
    --tele:#e6e6e2;--jami:#ff6a33;--jami-2:#ff9a6b;
    --series-1:#e6e6e2;--series-2:#ff6a33;--track:rgba(255,255,255,.07);
    --ok:#46b77d;--ok-bg:rgba(70,183,125,.14);--warn:#e0a63a;--warn-bg:rgba(224,166,58,.14);--bad:#ef6b5a;--bad-bg:rgba(239,107,90,.14);--info-bg:rgba(120,150,230,.14);
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'Noto Sans Ethiopic',sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
a{color:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.wrap{max-width:1280px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px max(40px,env(safe-area-inset-bottom))}
#app{background:var(--panel);border-radius:28px;padding:14px 14px 28px;min-height:calc(100vh - 20px)}
@media (min-width:760px){.wrap{padding:24px 24px 48px}#app{padding:18px 22px 36px}}
/* header */
header.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:6px 0 12px;background:var(--panel)}
.brand{display:inline-flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:6px 16px 6px 6px;box-shadow:var(--shadow);justify-self:start}
.brand .logo{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.brand b{font-size:15px;letter-spacing:-.01em}.brand small{color:var(--mut);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;grid-row:1;grid-column:2;justify-self:end}
@media (max-width:420px){.rl,.upd{display:none}header.top nav.tabs button{flex:1 1 auto;padding:0 8px;font-size:13px}.wl{gap:6px}.w{padding:9px}.w .wv{font-size:14px}.w .wv small{display:none}}
.upd{font-size:12px;color:var(--mut);white-space:nowrap}
.iconbtn{min-height:44px;min-width:44px;padding:0 14px;border:0;background:var(--card);border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
nav.tabs{grid-column:1/-1;display:flex;gap:2px;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;min-height:40px;padding:0 16px;border:0;background:transparent;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current=page]{background:var(--brand);color:var(--on-brand)}
@media (min-width:900px){header.top{grid-template-columns:1fr auto 1fr}nav.tabs{grid-column:2;grid-row:1}.tools{grid-column:3}nav.tabs button{flex:none}}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
nav.tabs button[aria-current=page] .badge{background:var(--accent);color:#fff}
.hello{margin:14px 2px 18px}.hello h1{margin:0;font-size:clamp(26px,4vw,38px);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.hello p{margin:6px 0 0;color:var(--ink-2);font-size:14px}
h2.sec{margin:26px 2px 12px;font-size:18px;font-weight:600;letter-spacing:-.01em;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px}
h2.sec a,h2.sec button{font-size:13px;font-weight:500;background:var(--card);border:0;border-radius:999px;color:var(--ink);cursor:pointer;padding:8px 14px;text-decoration:none;box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:12px}
@media (min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
/* dashboard grid */
.dgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.s12,.s8{grid-column:1/-1}}
@media (min-width:1120px){.dgrid{grid-template-columns:repeat(12,minmax(0,1fr))}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:1/-1}}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}.ch p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.link{font-size:13px;font-weight:500;background:var(--card-2);border:0;border-radius:999px;color:var(--ink);cursor:pointer;padding:8px 14px;white-space:nowrap;text-decoration:none}
.big{font-size:clamp(30px,3.4vw,38px);font-weight:600;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:.45em;font-weight:500;color:var(--mut);letter-spacing:0;margin-left:4px}
.delta{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--ok-bg);color:var(--ok)}
.delta.dn{background:var(--bad-bg);color:var(--bad)}.delta.flat{background:var(--card-2);color:var(--mut)}
.sub{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.pillbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.pillbtns .btn{min-height:50px;border-radius:999px;font-size:14px}
.wallets{background:var(--card-2);border-radius:18px;padding:12px}
.wallets .wh{font-size:13px;color:var(--ink-2);margin:2px 4px 10px}.wallets .wh span{color:var(--mut)}
.wl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.w{background:var(--card);border-radius:14px;padding:10px;min-width:0}
.w .wn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}.w .dot{width:10px;height:10px;border-radius:50%;flex:none}
.w .wv{margin-top:8px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w .ws{font-size:10.5px;color:var(--mut);margin-top:2px;line-height:1.3}
.w .st{font-size:11px;margin-top:4px;color:var(--ok)}.w .st.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card-2);border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:128px;min-width:0}
.tile .tl{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--ink-2);gap:6px}
.tile .ti{width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:14px;flex:none}
.tile .tv{font-size:clamp(22px,2.4vw,28px);font-weight:600;letter-spacing:-.03em;margin-top:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .sub{margin-top:6px}
.tile.hot{background:linear-gradient(160deg,var(--accent-2),var(--accent) 60%);color:#fff;box-shadow:0 18px 30px -18px var(--accent)}
.tile.hot .tl{color:rgba(255,255,255,.9)}.tile.hot .ti{background:rgba(255,255,255,.22)}.tile.hot .sub{color:rgba(255,255,255,.85)}
.tile.hot .delta{background:rgba(255,255,255,.22);color:#fff}
/* stacked money chart */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.hatch{background:repeating-linear-gradient(135deg,var(--jami) 0 4px,var(--jami-2) 4px 7px)}
.plot{background:var(--card-2);border-radius:18px;padding:14px 12px 10px}
.plot-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:13px;font-weight:600}
.cols{position:relative;height:190px;margin:10px 0 0 34px;display:flex;align-items:flex-end;gap:5px}
.cols .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.cols .gl span{position:absolute;left:-34px;top:-8px;font-size:10.5px;color:var(--mut);width:30px;text-align:right}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;cursor:pointer;position:relative;gap:2px;min-width:0}
.col i{display:block;width:100%;border-radius:6px;min-height:0}
.col i.t{background:var(--tele)}.col i.j{background:repeating-linear-gradient(135deg,var(--jami) 0 4px,var(--jami-2) 4px 7px)}
.col.zero::before{content:"";display:block;height:3px;background:var(--track);border-radius:2px}
.col:hover i,.col.sel i{filter:brightness(1.12)}
.col.sel::after{content:"";position:absolute;inset:-4px -2px;background:var(--track);border-radius:8px;z-index:-1}
.xlab{display:flex;gap:5px;margin:6px 0 0 34px;font-size:10.5px;color:var(--mut)}.xlab span{flex:1;text-align:center;min-width:0;overflow:hidden}
.readout{font-size:13px;color:var(--ink-2);min-height:1.3em}
/* tables */
.tw{overflow-x:auto;margin:0 -4px;border:1px solid var(--line);border-radius:16px}
table.act{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.act th{background:var(--card-2);font-weight:500;color:var(--mut);font-size:12.5px;text-align:left;padding:12px 14px}
table.act td{padding:13px 14px;border-top:1px solid var(--line);white-space:nowrap}
table.act tr[data-open]{cursor:pointer}table.act tr[data-open]:hover td{background:var(--card-2)}
table.act td.num{font-variant-numeric:tabular-nums;font-weight:600}
.stn{display:inline-flex;align-items:center;gap:10px}.stn i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:13px;background:var(--card-2)}
.sdot{display:inline-flex;align-items:center;gap:7px}.sdot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-paid{color:var(--ok)}.c-review{color:var(--warn)}.c-awaiting{color:var(--mut)}.c-rejected{color:var(--bad)}.c-removed{color:var(--mut)}
.via{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card-2);color:var(--ink-2)}.via.j{background:var(--accent-bg);color:var(--accent)}
/* progress (Jami success) */
.prog{height:16px;border-radius:999px;background:repeating-linear-gradient(135deg,var(--track) 0 4px,transparent 4px 8px),var(--card-2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.progl{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--mut)}.progl b{color:var(--ink);font-weight:600}
/* best times */
.ins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.ins{grid-template-columns:repeat(3,minmax(0,1fr))}}
.in{background:var(--card-2);border-radius:16px;padding:12px 14px;min-width:0}
.in .il{font-size:12px;color:var(--mut)}.in .iv{margin-top:6px;font-size:18px;font-weight:600;letter-spacing:-.02em}.in .is{font-size:12px;color:var(--ink-2);margin-top:2px}
.in.up .iv{color:var(--accent)}
.heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:3px;margin-top:16px;font-size:10.5px;color:var(--mut);align-items:center}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--track);display:block;min-height:8px}
.heat .hx{text-align:left;grid-column:span 6}
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px;margin-top:6px}
.wbars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mut)}
.wbars i{display:block;width:100%;max-width:38px;border-radius:8px;background:var(--tele);min-height:3px}.wbars .top i{background:var(--accent)}
/* tasks */
.task{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.task .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.t-review .ic{background:var(--warn-bg)}.t-help .ic{background:var(--info-bg)}.t-congrats .ic{background:var(--ok-bg)}.t-email .ic{background:var(--info-bg)}.t-to .ic{background:var(--ok-bg)}.t-inq .ic{background:var(--bad-bg)}
.task .tt{font-size:15px;font-weight:600;line-height:1.25}
.task .ts{margin-top:2px;font-size:13px;color:var(--ink-2);line-height:1.35}
.nextl .card{box-shadow:none;background:none;border-radius:0;padding:12px 0}.nextl .task{padding:12px 0;border-top:1px solid var(--line)}.nextl .task:first-child{border-top:0;padding-top:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--card-2);color:var(--ink);border:0}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.accent{background:var(--accent);color:#fff}
.btn[disabled]{opacity:.5}
.empty{padding:22px 14px;text-align:center;color:var(--ink-2);font-size:14px}
/* orders */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters button{flex:none;min-height:40px;padding:0 14px;border:0;background:var(--card);border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.filters button[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
input.search{width:100%;min-height:48px;padding:0 18px;border:0;background:var(--card);border-radius:999px;font-size:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.oid{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em}
.s-paid{background:var(--ok-bg);color:var(--ok)}.s-review{background:var(--warn-bg);color:var(--warn)}.s-rejected{background:var(--bad-bg);color:var(--bad)}.s-awaiting{background:var(--card-2);color:var(--ink-2)}.s-removed{background:var(--card-2);color:var(--mut)}
dl.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;margin:12px 0 0;font-size:14px}
dl.kv dt{color:var(--mut)}dl.kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--card-2);color:var(--ink-2)}
.chip.done{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.btn.tg{background:#229ED9;color:#fff;display:inline-flex;align-items:center;gap:6px}
.warnbar{margin:4px 0 8px;padding:12px 16px;border-radius:18px;background:var(--warn-bg);color:var(--ink);font-size:14px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.warnbar b{color:var(--warn)}
.newhits .nh-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.newhits .nh-side{font-size:13px;color:var(--ink-2);text-align:right;line-height:1.6}
.nh-bars{margin-top:14px;height:64px;display:flex;align-items:flex-end;gap:4px}
.nh-bars i{flex:1;background:var(--tele);border-radius:5px;min-height:3px}
button.chip{border:0;cursor:pointer;font:inherit;font-size:13px;padding:7px 14px;min-height:36px;background:var(--card-2)}
button.chip.on{background:var(--brand);color:var(--on-brand)}
.lbs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.lb{display:flex;flex-direction:column;gap:10px;background:var(--card-2);border-radius:18px;padding:14px}
.lb-h{display:flex;gap:10px;align-items:center}.lb-h .ic{font-size:24px;line-height:1}
.lb-h .tt{font-weight:600}.lb-h .ts{font-size:12.5px;color:var(--mut)}
.lb-l{list-style:none;margin:0;padding:0;display:grid;gap:4px;flex:1}
.lb-l li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.lb-l li:last-child{border-bottom:0}
.lb-l .pos{font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--mut);font-size:13px}
.lb-l .nm{overflow-wrap:anywhere}.lb-l small{display:block;font-size:12px;color:var(--mut)}
.lb-l .ct{font-weight:600;text-align:right}.lb-l .ct small{display:inline;font-weight:400}
.lb-l li.win .nm{font-weight:600;font-size:17px}.lb-l li.win .ct{font-size:17px;color:var(--accent)}
.lb .btn.ghost{background:var(--card)}
.reason{margin-top:10px;padding:8px 12px;background:var(--warn-bg);border-radius:12px;font-size:14px}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;margin-top:12px;font-size:13px}
.hbar:first-child{margin-top:0}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hbar .tr{height:12px;background:var(--track);border-radius:999px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--tele);border-radius:999px}
.hbar .val{font-variant-numeric:tabular-nums;font-weight:600;min-width:3ch;text-align:right}
.hbar.j .tr i{background:var(--accent)}
.split{display:flex;height:16px;gap:3px}
.split i{display:block;height:100%;border-radius:999px}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.mrow:first-child{border-top:0;padding-top:0}
.mrow span{color:var(--ink-2)}.mrow strong{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
/* forms */
details.new{background:var(--card);border-radius:22px;padding:0 18px;box-shadow:var(--shadow)}
details.new summary{min-height:56px;display:flex;align-items:center;font-weight:600;font-size:14px;cursor:pointer;list-style:none}
details.new summary::-webkit-details-marker{display:none}
.f{display:grid;gap:10px;padding:4px 0 16px}.f label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.f input,.f select,.f textarea{font-size:16px;min-height:48px;padding:0 14px;border:1px solid var(--line);background:var(--card-2);border-radius:14px;color:var(--ink)}
.f textarea{padding:10px 14px;min-height:80px;resize:vertical}.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.done-box{margin-top:6px;padding:12px;background:var(--ok-bg);border-radius:14px;font-size:14px}
.login{max-width:420px;margin:12vh auto 0;background:var(--card);border-radius:28px;padding:28px;box-shadow:var(--shadow)}
.login input{width:100%;min-height:52px;padding:0 18px;border:1px solid var(--line);background:var(--card-2);border-radius:999px;font-size:16px}
.login .btn{border-radius:999px}
.err{color:var(--bad);margin-top:10px;min-height:1.2em;font-size:14px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--brand);color:var(--on-brand);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
table.data{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.data th,table.data td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
table.data td:last-child,table.data th:last-child{text-align:right;font-variant-numeric:tabular-nums}
details.tbl summary{margin-top:12px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <section class="login" id="login">
    <div class="brand" style="box-shadow:none;padding:0;margin-bottom:18px"><span class="logo">D</span><b>DINGUY</b><small>Office · staff only</small></div>
    <h1 style="margin:0 0 18px;font-size:32px;font-weight:600;letter-spacing:-.03em">Sign in</h1>
    <form id="loginForm" style="display:grid;gap:10px">
      <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
      <button class="btn" type="submit" style="min-height:52px">OPEN</button>
    </form>
    <div class="err" id="err"></div>
  </section>
  <div id="app" hidden>
    <header class="top">
      <div class="brand"><span class="logo" aria-hidden="true">D</span><b>DINGUY</b><small>Office</small></div>
      <nav class="tabs" id="tabs"></nav>
      <div class="tools"><span class="upd" id="updated"></span><button class="iconbtn" id="refresh" aria-label="Refresh">↻<span class="rl"> Refresh</span></button></div>
    </header>
    <div id="warn" role="alert"></div>
    <main id="view"></main>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ='Africa/Addis_Ababa';
let SW_MAIL='offscriptet@gmail.com'; // the sending address; the server's setting wins (see load())
let pw='';try{pw=sessionStorage.getItem('dg-admin')||''}catch(e){}
const S={orders:[],inquiries:[],auto:{},lb:'30d',tab:'dash',filter:'all',q:'',sel:null,loadedAt:0};
try{const t=sessionStorage.getItem('dg-tab');if(t)S.tab=t;}catch(e){}

async function api(method,body,query=''){
  const r=await fetch('/api/admin'+query,{method,headers:{'x-admin-password':pw,'content-type':'application/json'},body:body?JSON.stringify(body):undefined,keepalive:method==='POST'});
  const j=await r.json().catch(()=>({error:'Bad response'}));if(!r.ok)throw new Error(j.error||r.status);return j;
}
async function load(){
  $('#err').textContent='';
  try{const j=await api('GET');S.orders=j.orders;S.inquiries=j.inquiries||[];S.auto=j.auto||{};S.verifier=j.verifier||null;S.newHits=j.newHits||null;S.baseline=j.baseline||null;if(S.auto.from)SW_MAIL=S.auto.from;S.loadedAt=Date.now();
    try{sessionStorage.setItem('dg-admin',pw)}catch(e){}
    $('#login').hidden=true;$('#app').hidden=false;render();}
  catch(e){$('#err').textContent=e.message;$('#login').hidden=false;$('#app').hidden=true;}
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}

/* ---------- helpers ---------- */
const when=ms=>ms?new Date(ms).toLocaleString('en-GB',{timeZone:TZ,day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
function ago(ms){if(!ms)return'';const m=Math.round((Date.now()-ms)/60000);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';const d=Math.round(h/24);return d+' d ago';}
const dayKey=ms=>new Date(ms).toLocaleDateString('en-CA',{timeZone:TZ});
const fmtBirr=n=>Math.round(n).toLocaleString('en-US')+' Birr';
const isFriend=o=>o.price===89;
const F=o=>o.follow||{};

// SMS / email texts come from the server (api/_notify.js), the same ones it sends automatically.
const msgs=o=>o.msgs||{help:'',congrats:'',subject:'',body:''};
const smsHref=(phone,body)=>'sms:'+phone+'?&body='+encodeURIComponent(body);
// Telegram: opens a chat with that phone number (works if they have Telegram); the message is copied on tap, so you just paste and send.
const tgHref=phone=>'https://t.me/+251'+String(phone||'').replace(/^0/,'');
const TG_ICON='<svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" style="flex:none;fill:currentColor"><path d="M21.9 4.6 18.8 19.3c-.2 1-.8 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.8-7.9c.4-.3-.1-.5-.6-.2L6.8 13.2l-4.7-1.5c-1-.3-1-1 .2-1.5L20.6 3c.8-.3 1.6.2 1.3 1.6z"/></svg>';
// Main "send" button (Telegram) + a small SMS fallback for when the phone's SMS works again.
const sendBtns=(o,what,phone,text,label)=>`<a class="btn tg" href="${esc(tgHref(phone))}" target="_blank" rel="noopener" data-tgcopy="${esc(text)}" data-mark="${what}" data-id="${esc(o.id)}">${TG_ICON}${label}</a>`
  +`<a class="btn ghost" href="${esc(smsHref(phone,text))}" data-mark="${what}" data-id="${esc(o.id)}">SMS</a>`
  +copyBtn(o,what,text);
// Copies the ready-made text, so it can be pasted into any SMS app; also records it as sent.
const copyBtn=(o,what,text,label='Copy message')=>text?`<button class="btn ghost" data-copytext="${esc(text)}" data-cmark="${esc(what||'')}" data-id="${esc(o.id)}">${label}</button>`:'';
const mailHref=(o,m)=>`mailto:${o.email}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;
// Opens Gmail's compose window signed in as the SIDEWAYS address, everything filled in.
const gmailHref=(o,m)=>`https://mail.google.com/mail/?authuser=${encodeURIComponent(SW_MAIL)}&view=cm&fs=1&to=${encodeURIComponent(o.email)}&su=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;
const emailLinks=(o,m,label)=>`<a class="btn" href="${esc(gmailHref(o,m))}" target="_blank" rel="noopener" data-mark="email" data-id="${esc(o.id)}">${label}</a><a class="btn ghost" href="${esc(mailHref(o,m))}" data-mark="email" data-id="${esc(o.id)}">Other mail app</a>`;
// A link that also records the follow-up when tapped.
const markLink=(o,what,href,label,cls='btn')=>`<a class="${cls}" href="${esc(href)}" data-mark="${what}" data-id="${esc(o.id)}">${label}</a>`;

/* ---------- tasks ---------- */
function tasks(){
  const now=Date.now(),out=[];
  for(const o of S.orders){
    const f=F(o);
    if(o.status==='review')out.push({p:1,k:'review',o,ic:'🔎',t:`Check payment ${o.txn||''}`,s:`${o.name} for ${o.to} · ${o.price} Birr · ${o.reason||'waiting for you'}`,at:o.submittedAt||o.createdAt});
    if((o.status==='awaiting'||o.status==='rejected')&&o.phone&&!f.help_sms&&!f.help_skip&&now-o.createdAt>10*60e3&&now-o.createdAt<7*864e5)
      out.push({p:3,k:'help',o,ic:'💬',t:`Help ${o.by} pay`,s:`${o.status==='rejected'?'Code was rejected':'Didn’t pay yet'} · ${o.name} · ordered ${ago(o.createdAt)}`,at:o.createdAt});
    const recent=now-(o.approvedAt||o.createdAt)<7*864e5; // older paid orders don't flood the list
    if(o.status==='paid'&&recent&&o.phone&&!f.congrats_sms&&!f.congrats_skip)
      out.push({p:2,k:'congrats',o,ic:'🎉',t:`Text congrats to ${o.by}`,s:`${o.to} · ${o.name} · paid ${ago(o.approvedAt)}`,at:o.approvedAt});
    if(o.status==='paid'&&recent&&o.toPhone&&!f.to_sms&&!f.to_skip)
      out.push({p:2,k:'to',o,ic:'🎁',t:`Text ${o.to} their record`,s:`${o.toPhone} · from ${o.by} · ${o.name}`,at:o.approvedAt});
    if(o.status==='paid'&&recent&&o.email&&!o.toPhone&&!f.email&&!f.email_skip)
      out.push({p:2,k:'email',o,ic:'✉️',t:`Email the certificate to ${o.to}`,s:`${o.email} · from ${o.by} · sends from ${SW_MAIL}`,at:o.approvedAt});
  }
  for(const q of S.inquiries)if(q.status!=='done')out.push({p:2,k:'inq',q,ic:'📨',t:`Reply to ${q.name}`,s:`SIDEWAYS · ${q.need} · ${ago(q.createdAt)}`,at:q.createdAt});
  return out.sort((a,b)=>a.p-b.p||(a.at||0)-(b.at||0));
}
function reachLink(r){const t=String(r||'').trim();if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t))return `mailto:${t}`;const d=t.replace(/[^\d+]/g,'');return d.length>=9?`tel:${d}`:'';}
function taskCard(t){
  const o=t.o;let acts='';
  if(t.k==='review')acts=`<a class="btn ghost" href="https://transactioninfo.ethiotelecom.et/receipt/${encodeURIComponent(o.txn||'')}" target="_blank" rel="noopener noreferrer">Open receipt ↗</a><button class="btn ok" data-a="approve" data-id="${esc(o.id)}">Approve</button><button class="btn bad" data-a="reject" data-id="${esc(o.id)}">Reject</button>`;
  if(t.k==='help')acts=sendBtns(o,'help_sms',o.phone,msgs(o).help,'Send help on Telegram')+`<a class="btn ghost" href="tel:${esc(o.phone)}" data-mark="call" data-id="${esc(o.id)}">Call</a><button class="btn ghost" data-skip="help_skip" data-id="${esc(o.id)}">Skip</button>`;
  if(t.k==='to')acts=sendBtns(o,'to_sms',o.toPhone,msgs(o).gift,'Send to '+esc(o.to)+' on Telegram')+`<button class="btn ghost" data-skip="to_skip" data-id="${esc(o.id)}">Skip</button>`;
  if(t.k==='congrats')acts=sendBtns(o,'congrats_sms',o.phone,msgs(o).congrats,'Send congrats on Telegram')+`<button class="btn ghost" data-skip="congrats_skip" data-id="${esc(o.id)}">Skip</button>`;
  if(t.k==='email')acts=emailLinks(o,msgs(o),'Send from Gmail')+`<button class="btn ghost" data-skip="email_skip" data-id="${esc(o.id)}">Skip</button>`;
  if(t.k==='inq'){const q=t.q,h=reachLink(q.reach);acts=(h?`<a class="btn" href="${esc(h)}">${h.startsWith('mailto')?'Email':'Call'} ${esc(q.name)}</a>`:'')+`<button class="btn ghost" data-q="${esc(q.id)}" data-qa="done">Mark done</button>`;}
  const sub=t.k==='inq'&&t.q.msg?`${esc(t.s)}<br>“${esc(t.q.msg.slice(0,140))}”`:esc(t.s);
  return `<div class="card task t-${t.k}"><div class="ic" aria-hidden="true">${t.ic}</div><div><div class="tt">${esc(t.t)}</div><div class="ts">${sub}</div><div class="acts">${acts}</div></div></div>`;
}

/* ---------- stats ---------- */
function stats(){
  const real=S.orders.filter(o=>!o.manual);
  const paid=S.orders.filter(o=>o.status==='paid');
  // Money = what telebirr receipts say was received. Hand-added registrations aren't counted;
  // removed records still count if a receipt shows real money came in.
  const counted=S.orders.filter(o=>!o.manual&&(o.status==='paid'||(o.status==='removed'&&o.paidAmount!=null))&&!(byJami(o)&&o.jami&&o.jami.sandbox)); // Jami sandbox = test money
  // All-time money = the checked starting totals + what was paid after them (see BASELINE in api/admin.js).
  const B=S.baseline||{at:0,telebirr:0,jami:0},after=counted.filter(o=>(o.approvedAt||o.createdAt||0)>=B.at);
  const amt=o=>o.paidAmount!=null?o.paidAmount:o.price;
  const sum=l=>l.reduce((a,o)=>a+amt(o),0);
  const today=dayKey(Date.now()),wk=Date.now()-7*864e5;
  const rev=B.telebirr+B.jami+sum(after);
  const revToday=sum(counted.filter(o=>dayKey(o.approvedAt||o.createdAt)===today));
  const rev7=sum(counted.filter(o=>(o.approvedAt||0)>=wk));
  const paidAt=o=>o.approvedAt||o.createdAt||0,inR=(a,b)=>counted.filter(o=>paidAt(o)>=Date.now()-a*864e5&&paidAt(o)<Date.now()-b*864e5);
  const yday=dayKey(Date.now()-864e5),revY=sum(counted.filter(o=>dayKey(paidAt(o))===yday));
  const n7=inR(7,0).length,nP7=inR(14,7).length,revP7=sum(inR(14,7)),rev30=sum(inR(30,0)),revP30=sum(inR(60,30));
  const sinceJ=sum(after.filter(byJami)),sinceT=sum(after.filter(o=>!byJami(o)));
  const noReceipt=after.filter(o=>o.paidAmount==null);
  const manual=S.orders.filter(o=>o.manual&&o.status==='paid');
  const missing=after.filter(o=>o.receiptMissing);
  const byAcct={};for(const o of after)if(o.paidAmount!=null&&!o.receiptMissing){const k=o.paidTo||'?';byAcct[k]=(byAcct[k]||0)+o.paidAmount;}
  const realPaid=real.filter(o=>o.status==='paid'||o.status==='removed');
  const coded=real.filter(o=>o.txn);
  const conv=real.length?Math.round(realPaid.length/real.length*100):0;
  const mins=realPaid.map(o=>((o.approvedAt||0)-(o.createdAt||0))/60000).filter(x=>x>0).sort((a,b)=>a-b);
  const med=mins.length?mins[Math.floor(mins.length/2)]:null;
  // last 14 days revenue
  const days=[];for(let i=13;i>=0;i--){const t=Date.now()-i*864e5;days.push({k:dayKey(t),label:new Date(t).toLocaleDateString('en-GB',{timeZone:TZ,day:'numeric',month:'short'}),dn:new Date(t).toLocaleDateString('en-GB',{timeZone:TZ,day:'numeric'}),v:0,n:0,t:0,j:0});}
  const byDay=Object.fromEntries(days.map(d=>[d.k,d]));
  for(const o of counted){const d=byDay[dayKey(o.approvedAt||o.createdAt)];if(d){d.v+=amt(o);d.n++;d[byJami(o)?'j':'t']+=amt(o);}}
  const byStone={};for(const o of paid){byStone[o.name]=(byStone[o.name]||0)+1;}
  const stones=Object.entries(byStone).sort((a,b)=>b[1]-a[1]);
  const fr=paid.filter(isFriend).length,lv=paid.length-fr;
  const am=paid.filter(o=>o.lang==='am').length;
  return {B,revY,n7,nP7,revP7,rev30,revP30,sinceJ,sinceT,rev,revToday,rev7,counted:after.length,missing,noReceipt,manual,byAcct,paid:paid.length,conv,med,real:real.length,coded:coded.length,realPaid:realPaid.length,days,stones,fr,lv,am};
}

/* ---------- of the month ---------- */
// Worked out from the orders on every load, so nothing extra is stored.
// Buyers are matched by phone (or name if there's no phone); receivers by name, ignoring case and spaces.
const LB_RANGES={'30d':'Last 30 days',month:'This month',last:'Last month'};
function lbWindow(r){
  if(r==='30d'){const e=Date.now();return{from:e-30*864e5,to:e};}
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:TZ}));
  const y=now.getFullYear(),m=now.getMonth()-(r==='last'?1:0);
  // Addis Ababa is UTC+3 all year
  return{from:Date.UTC(y,m,1)-3*36e5,to:Date.UTC(y,m+1,1)-3*36e5};
}
const normName=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
function rank(list,keyOf,nameOf){
  const m=new Map();
  for(const o of list){const k=keyOf(o);if(!k)continue;const e=m.get(k)||{n:0,birr:0,names:{},last:0};e.n++;e.birr+=o.price;const nm=nameOf(o);e.names[nm]=(e.names[nm]||0)+1;e.last=Math.max(e.last,o.approvedAt||0);if(o.phone)e.phone=o.phone;m.set(k,e);}
  return [...m.values()].map(e=>({...e,name:Object.entries(e.names).sort((a,b)=>b[1]-a[1])[0][0]})).sort((a,b)=>b.n-a.n||b.birr-a.birr||a.last-b.last).slice(0,3);
}
function leaders(r){
  const w=lbWindow(r);
  const paid=S.orders.filter(o=>o.status==='paid'&&!o.manual&&(o.approvedAt||o.createdAt)>=w.from&&(o.approvedAt||o.createdAt)<w.to);
  const fr=paid.filter(isFriend),lv=paid.filter(o=>!isFriend(o));
  const buyer=o=>o.phone||'n:'+normName(o.by),to=o=>normName(o.to)||null;
  return {n:paid.length,boards:[
    {id:'player',ic:'🏆',title:'Player of the month',what:'Bought the most Dinguys',unit:'bought',rows:rank(paid,buyer,o=>o.by)},
    {id:'friend',ic:'🤝',title:'Friend of the month',what:'Bought the most for friends',unit:'bought',rows:rank(fr,buyer,o=>o.by)},
    {id:'lover',ic:'💘',title:'Lover boy of the month',what:'Bought the most for loved ones',unit:'bought',rows:rank(lv,buyer,o=>o.by)},
    {id:'dingay',ic:'🪨',title:'Dingay of the month',what:'Got the most stones as a friend',unit:'received',rows:rank(fr,to,o=>o.to)},
    {id:'loved',ic:'💎',title:'Most loved of the month',what:'Got the most stones as a loved one',unit:'received',rows:rank(lv,to,o=>o.to)},
  ]};
}
function postText(b,r){const t=b.rows[0];if(!t)return'';
  return `${b.ic} DINGUY ${b.title.toUpperCase()} — ${LB_RANGES[r].toLowerCase()}\n\n${t.name}\n${t.n} ${t.n===1?'Dinguy':'Dinguys'} ${b.unit}\n\nRegister one for someone: dinguy.xyz`;}
// Interest in new Dinguys: taps on the "NEW" button in the site header.
function viewNewHits(){
  const h=S.newHits;if(!h)return '';
  const last7=h.days.slice(-7).reduce((a,d)=>a+d.n,0),today=h.days[h.days.length-1].n,max=Math.max(1,...h.days.map(d=>d.n));
  const bars=h.days.map(d=>`<i title="${esc(d.d)}: ${d.n}" style="height:${Math.max(4,d.n/max*100).toFixed(0)}%;${d.n?'':'opacity:.25'}"></i>`).join('');
  return card('Want new Dinguys?','Taps on the “NEW” button',`
    <div class="newhits"><div class="nh-top"><div><div class="big">${h.people}</div><div class="sub">people tapped it</div></div>
      <div class="nh-side"><div><b>${h.taps}</b> taps in total</div><div><b>${last7}</b> this week · <b>${today}</b> today</div></div></div>
    <div class="nh-bars" role="img" aria-label="People per day, last 14 days">${bars}</div>
    <div class="readout" style="margin-top:8px">People per day, last 14 days. One person counts once per phone.</div></div>`,'s4');
}
// A dashboard card: title, a line under it, an optional button on the right.
const card=(t,sub,body,cls='',extra='')=>`<section class="card ${cls}"><div class="ch"><div><h3>${t}</h3>${sub?`<p>${sub}</p>`:''}</div>${extra}</div>${body}</section>`;
// ↑ 12% / ↓ 5% against the period before; nothing when there's nothing to compare with.
function delta(now,before){
  if(!before)return now?'<span class="delta">new</span>':'<span class="delta flat">–</span>';
  const p=Math.round((now-before)/before*100);
  return `<span class="delta${p<0?' dn':p===0?' flat':''}">${p<0?'↓':p>0?'↑':''} ${Math.abs(p)}%</span>`;
}
const num=n=>Math.round(n).toLocaleString('en-US');
const birr=n=>`${num(n)}<small>Birr</small>`;

// Paid on Jami: orders JamiDev confirmed (Telebirr / M-Pesa / CBE Birr push on the buyer's phone).
const GW={telebirr:'Telebirr',mpesa:'M-Pesa',cbe:'CBE Birr'};
const byJami=o=>o.approvedBy==='jami'||o.paidTo==='jami';
function jamiStats(){
  const tried=S.orders.filter(o=>!o.manual&&o.jami&&o.jami.startedAt&&!o.jami.sandbox);
  const paid=S.orders.filter(o=>byJami(o)&&(o.status==='paid'||o.status==='removed'));
  const live=paid.filter(o=>!(o.jami&&o.jami.sandbox)),test=paid.length-live.length;
  const B=S.baseline||{at:0,jami:0},since=live.filter(o=>((o.jami&&o.jami.paidAt)||o.approvedAt||0)>=B.at);
  const amt=o=>o.paidAmount!=null?o.paidAmount:o.price,sum=l=>l.reduce((a,o)=>a+amt(o),0);
  const at=o=>(o.jami&&o.jami.paidAt)||o.approvedAt||0;
  const today=dayKey(Date.now()),wk=Date.now()-7*864e5;
  const open=tried.filter(o=>o.status==='awaiting'&&o.jami.state==='open'),expired=tried.filter(o=>o.status!=='paid'&&o.status!=='removed'&&o.jami.state==='expired');
  const gw={};for(const o of live){const k=(o.jami&&o.jami.gateway)||'telebirr';gw[k]=gw[k]||{n:0,v:0};gw[k].n++;gw[k].v+=amt(o);}
  const triedPaid=tried.filter(o=>byJami(o)).length;
  return {B,tried:tried.length,triedPaid,n:live.length,test,rev:B.jami+sum(since),revToday:sum(live.filter(o=>dayKey(at(o))===today)),n7:live.filter(o=>at(o)>=wk).length,rev7:sum(live.filter(o=>at(o)>=wk)),

// When people buy: paid orders by the time they ordered, in Addis Ababa time (UTC+3, no daylight saving).
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const addis=ms=>{const d=new Date(ms+3*3600e3);return{wd:d.getUTCDay(),h:d.getUTCHours()};};
const hr=h=>`${String(h).padStart(2,'0')}:00–${String((h+1)%24).padStart(2,'0')}:00`;
function timeStats(){
  const paid=S.orders.filter(o=>!o.manual&&(o.status==='paid'||o.status==='removed')&&!(o.jami&&o.jami.sandbox&&byJami(o)));
  const amt=o=>o.paidAmount!=null?o.paidAmount:o.price;
  const grid=Array.from({length:7},()=>Array(24).fill(0)),wd=Array.from({length:7},()=>({n:0,v:0})),hours=Array.from({length:24},()=>({n:0,v:0})),dates={};
  for(const o of paid){const {wd:w,h}=addis(o.createdAt||o.approvedAt);grid[w][h]++;wd[w].n++;wd[w].v+=amt(o);hours[h].n++;hours[h].v+=amt(o);
    const k=dayKey(o.approvedAt||o.createdAt);dates[k]=dates[k]||{n:0,v:0};dates[k].n++;dates[k].v+=amt(o);}
  const by=(l,f)=>l.map((x,i)=>({...x,i})).sort(f);
  const wdS=by(wd,(a,b)=>b.n-a.n||b.v-a.v),day=by(hours.slice(8,23).map((x,i)=>({...x,h:i+8})),(a,b)=>a.n-b.n||a.v-b.v);
  const hS=by(hours,(a,b)=>b.n-a.n||b.v-a.v);
  const ds=Object.entries(dates).sort((a,b)=>b[1].v-a[1].v);
  // slowest of the last 30 days, counting days with no sales
  const last30=Array.from({length:30},(_,i)=>{const k=dayKey(Date.now()-i*864e5);return [k,dates[k]||{n:0,v:0}];}).sort((a,b)=>a[1].v-b[1].v);
  return {n:paid.length,grid,wd,wdS,hS,day,ds,last30};
}
const dLabel=k=>new Date(k+'T12:00:00+03:00').toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short'});
function viewTimes(){
  const t=timeStats();
  if(!t.n)return card('When people buy','',`<div class="empty">No paid orders yet.</div>`,'s8');
  const maxC=Math.max(1,...t.grid.flat()),maxW=Math.max(1,...t.wd.map(x=>x.n));
  const order=[1,2,3,4,5,6,0];
  const best=t.wdS[0],worst=t.wdS[t.wdS.length-1],peak=t.hS[0],quiet=t.day[0],top=t.ds[0],slow=t.last30[0];
  const ins=[
    ['Busiest day',WD[best.i],`${best.n} paid · ${fmtBirr(best.v)}`,1],
    ['Slowest day',WD[worst.i],`${worst.n} paid · ${fmtBirr(worst.v)}`],
    ['Peak hour',hr(peak.i),`${peak.n} paid · ${fmtBirr(peak.v)}`,1],
    ['Quietest daytime hour',hr(quiet.h),`${quiet.n} paid · between 08:00 and 23:00`],
    ['Best day ever',dLabel(top[0]),`${top[1].n} paid · ${fmtBirr(top[1].v)}`,1],
    ['Slowest day, last 30',dLabel(slow[0]),`${slow[1].n} paid · ${fmtBirr(slow[1].v)}`],
  ].map(([l,v,s2,up])=>`<div class="in${up?' up':''}"><div class="il">${l}</div><div class="iv">${esc(v)}</div><div class="is">${esc(s2)}</div></div>`).join('');
  const wbars=order.map(i=>`<div class="${i===best.i?'top':''}"><i style="height:${Math.max(3,t.wd[i].n/maxW*100).toFixed(0)}%" title="${WD[i]}: ${t.wd[i].n} paid"></i>${WD[i].slice(0,3)}</div>`).join('');
  const heat=order.map(w=>`<span>${WD[w].slice(0,3)}</span>`+t.grid[w].map((c,h)=>`<i title="${WD[w]} ${hr(h)}: ${c} paid" style="${c?`background:var(--accent);opacity:${(.18+.82*c/maxC).toFixed(2)}`:''}"></i>`).join('')).join('');
  const body=`<div class="ins">${ins}</div>
    <div class="dgrid" style="margin-top:14px;gap:12px">
      <div class="plot s4"><div class="plot-h">By day of the week</div><div class="wbars">${wbars}</div></div>
      <div class="plot s8"><div class="plot-h">Day × hour <span class="readout" style="font-weight:400">darker = more sales</span></div>
        <div class="heat" role="img" aria-label="Paid orders by weekday and hour">${heat}<span></span>${[0,6,12,18].map(h=>`<span class="hx">${String(h).padStart(2,'0')}:00</span>`).join('')}</div></div>
    </div>`;
  return card('When people buy',`${t.n} paid orders, by the time they ordered (Addis Ababa time)`,body,'s8');
}

  add('help_sms','Help SMS');add('congrats_sms','Congrats SMS');add('to_sms','Texted them');add('buyer_email','Receipt emailed');add('help_email','Help emailed');add('email','Emailed');add('call','Called');

  return c.length?`<div class="chips">${c.join('')}</div>`:'';
}
function orderCard(o){
  const m=msgs(o),a=[];
  if(o.phone){a.push(`<a class="btn ghost" href="tel:${esc(o.phone)}" data-mark="call" data-id="${esc(o.id)}">Call</a>`);
    if(o.status==='paid')a.push(sendBtns(o,'congrats_sms',o.phone,m.congrats,'Congrats'));
    else if(o.status!=='removed')a.push(sendBtns(o,'help_sms',o.phone,m.help,'Help'));}
  if(o.toPhone&&o.status==='paid')a.push(sendBtns(o,'to_sms',o.toPhone,m.gift,'Text '+esc(o.to)));
  else if(o.status==='paid')a.push(copyBtn(o,'',m.gift,'Copy message for '+esc(o.to)));
  if(!o.phone&&o.status==='paid')a.push(copyBtn(o,'',m.congrats,'Copy congrats for '+esc(o.by)));
  if(o.status!=='removed')a.push(`<button class="btn ghost" data-edit="${esc(o.id)}">Edit details</button>`);
  if(o.email&&o.status==='paid')a.push(emailLinks(o,m,'Email '+esc(o.to)));
  if(o.status==='review'||o.status==='awaiting'||o.status==='rejected')a.push(`<button class="btn ok" data-a="approve" data-id="${esc(o.id)}">Approve</button>`);
  if(o.status==='review'||o.status==='awaiting')a.push(`<button class="btn bad" data-a="reject" data-id="${esc(o.id)}">Reject</button>`);
  if(o.status==='paid')a.push(`<a class="btn ghost" href="${esc(o.recordLink)}" target="_blank" rel="noopener">Record ↗</a><button class="btn ghost" data-a="remove" data-id="${esc(o.id)}">Remove</button>`);
  if(o.status==='removed')a.push(`<button class="btn" data-a="restore" data-id="${esc(o.id)}">Restore to registry</button>`);
  const label={paid:'PAID',review:'CHECK',awaiting:'NOT PAID',rejected:'REJECTED',removed:'REMOVED'}[o.status]||o.status;
  return `<div class="card">
    <div class="row"><span class="oid">${esc(o.id)}</span><span class="pill s-${esc(o.status)}">${label}</span></div>
    <div style="margin-top:8px;font-size:17px;font-weight:700">${esc(o.to)} <span style="font-weight:500;color:var(--ink-2)">from ${esc(o.by)}</span></div>
    <dl class="kv">
      <dt>Stone</dt><dd>${esc(o.name)} · ${o.price} Birr${o.manual?' · added by hand':''}</dd>
      <dt>Ordered</dt><dd>${when(o.createdAt)}${o.lang==='am'?' · አማርኛ':''}</dd>
      ${o.phone?`<dt>Phone</dt><dd><a href="tel:${esc(o.phone)}" data-mark="call" data-id="${esc(o.id)}">${esc(o.phone)}</a></dd>`:''}
      ${o.toPhone?`<dt>Their phone</dt><dd><a href="tel:${esc(o.toPhone)}">${esc(o.toPhone)}</a></dd>`:''}
      ${o.email?`<dt>Their email</dt><dd>${esc(o.email)}</dd>`:''}
      ${o.byEmail?`<dt>Buyer email</dt><dd>${esc(o.byEmail)}</dd>`:''}
      ${o.txn?`<dt>Transaction</dt><dd>${o.manual?esc(o.txn):`<a href="https://transactioninfo.ethiotelecom.et/receipt/${encodeURIComponent(o.txn)}" target="_blank" rel="noopener noreferrer">${esc(o.txn)} ↗</a>`}</dd>`:''}
      ${o.paidAmount!=null?`<dt>Received</dt><dd>${esc(o.paidAmount)} Birr${o.paidTo?' → …'+esc(o.paidTo):''}${o.payer?' · from '+esc(o.payer):''}</dd>`:''}
      ${o.jami?`<dt>Jami</dt><dd>${byJami(o)?'Paid':o.jami.state==='expired'?'Expired, not paid':'Started'} · ${esc(GW[o.jami.gateway]||o.jami.gateway||'')}${o.jami.sandbox?' · TEST':''} · ${when((o.jami.paidAt||o.jami.startedAt))}</dd>`:''}
      ${o.approvedBy?`<dt>Approved</dt><dd>${esc(o.approvedBy)} · ${when(o.approvedAt)}</dd>`:''}
      ${o.message?`<dt>Message</dt><dd>“${esc(o.message)}”</dd>`:''}
    </dl>
    ${o.reason&&o.status==='review'?`<div class="reason">${esc(o.reason)}</div>`:''}
    ${followChips(o)}
    <div class="acts">${a.join('')}</div>
    ${S.edit===o.id?editForm(o):''}
  </div>`;
}
// Fix names and other certificate details. Paid records update on the public registry and certificate right away.
function editForm(o){
  const occ=['Birthday','Anniversary','Graduation','Farewell','Apology','Just because'];
  return `<form class="f" data-editform="${esc(o.id)}" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
    <div class="two"><label>For (recipient)<input name="to" required maxlength="28" value="${esc(o.to)}"></label><label>From (buyer)<input name="by" required maxlength="28" value="${esc(o.by)}"></label></div>
    <label>Occasion<select name="occasion"><option value="">—</option>${occ.map(x=>`<option${o.occasion===x?' selected':''}>${x}</option>`).join('')}</select></label>
    <label>Message<textarea name="message" maxlength="140">${esc(o.message||'')}</textarea></label>
    <div class="two"><label>Buyer phone<input name="phone" type="tel" value="${esc(o.phone||'')}"></label><label>Recipient phone<input name="toPhone" type="tel" value="${esc(o.toPhone||'')}"></label></div>
    <div class="two"><label>Buyer email<input name="byEmail" type="email" value="${esc(o.byEmail||'')}"></label><label>Recipient email<input name="email" type="email" value="${esc(o.email||'')}"></label></div>
    <div class="acts" style="margin-top:0"><button class="btn" type="submit">Save changes</button><button class="btn ghost" type="button" data-edit="${esc(o.id)}">Cancel</button></div>
  </form>`;
}
function viewOrders(){
  const FIL=[['all','All'],['review','Check'],['awaiting','Not paid'],['paid','Paid'],['jami','Paid on Jami'],['rejected','Rejected'],['removed','Removed']];
  const q=S.q.trim().toLowerCase();
  const list=S.orders.filter(o=>(S.filter==='all'||(S.filter==='jami'?byJami(o)&&o.status==='paid':o.status===S.filter))&&(!q||[o.id,o.to,o.by,o.phone,o.toPhone,o.txn,o.email,o.byEmail].some(v=>String(v||'').toLowerCase().includes(q))));
  const cnt=k=>k==='all'?S.orders.length:k==='jami'?S.orders.filter(o=>byJami(o)&&o.status==='paid').length:S.orders.filter(o=>o.status===k).length;
  return `<div style="margin-top:14px"><input class="search" id="q" type="search" placeholder="Search name, phone, DG-…, transaction" value="${esc(S.q)}">
    <div class="filters">${FIL.map(([k,l])=>`<button data-filter="${k}" aria-pressed="${S.filter===k}">${l} · ${cnt(k)}</button>`).join('')}</div></div>
    <div class="grid" style="margin-top:12px">${list.slice(0,80).map(orderCard).join('')||'<div class="card empty">Nothing here.</div>'}</div>
    ${list.length>80?`<div class="empty">Showing 80 of ${list.length}. Search to narrow down.</div>`:''}
    <h2 class="sec"><span>Add by hand</span></h2>${newForm()}`;
}
function viewInq(){
  if(!S.inquiries.length)return `<div class="card empty" style="margin-top:16px">No SIDEWAYS inquiries yet.</div>`;
  return `<div class="grid" style="margin-top:14px">${S.inquiries.map(q=>{const h=reachLink(q.reach);return `<div class="card" style="${q.status==='done'?'opacity:.6':''}">
    <div class="row"><strong style="font-size:17px">${esc(q.name)}</strong><span class="pill ${q.status==='done'?'s-awaiting':'s-review'}">${q.status==='done'?'DONE':'NEW'}</span></div>
    <dl class="kv"><dt>Contact</dt><dd>${h?`<a href="${esc(h)}">${esc(q.reach)}</a>`:esc(q.reach)}</dd><dt>Needs</dt><dd>${esc(q.need)}</dd><dt>Received</dt><dd>${when(q.createdAt)}</dd></dl>
    ${q.msg?`<p style="margin:10px 0 0;white-space:pre-wrap;font-size:15px;line-height:1.45">${esc(q.msg)}</p>`:''}
    <div class="acts">${h?`<a class="btn" href="${esc(h)}">${h.startsWith('mailto')?'Email':'Call'}</a>`:''}<button class="btn ghost" data-q="${esc(q.id)}" data-qa="${q.status==='done'?'new':'done'}">${q.status==='done'?'Mark as new':'Mark done'}</button></div>
  </div>`;}).join('')}</div>`;
}
const STONES=[['cobblestone','COBBLESTONE · 89'],['bloket','ብሎኬት · 89'],['river-stone','የወንዝ ድንጋይ · 89'],['foundation-stone','መሰረት ድንጋይ · 89'],['queen-of-sheba','THE QUEEN OF SHEBA · 199'],['mezezo-chocolate-opal','MEZEZO CHOCOLATE OPAL · 199'],['shakiso-emerald','SHAKISO EMERALD · 199'],['diamond','DIAMOND · 199']];
function newForm(){
  return `<details class="new"><summary>+ New registration (paid another way, or a gift)</summary>
    <form class="f" id="newform">
      <label>Stone<select name="slug" required><option value="">Choose…</option>${STONES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>
      <div class="two"><label>For (recipient)<input name="to" required maxlength="28"></label><label>From (buyer)<input name="by" required maxlength="28"></label></div>
      <label>Occasion<select name="occasion"><option value="">—</option>${['Birthday','Anniversary','Graduation','Farewell','Apology','Just because'].map(o=>`<option>${o}</option>`).join('')}</select></label>
      <label>Message<textarea name="message" maxlength="140"></textarea></label>
      <div class="two"><label>Buyer phone<input name="phone" type="tel" inputmode="tel" placeholder="09XX XXX XXX"></label><label>Recipient phone<input name="toPhone" type="tel" inputmode="tel" placeholder="09XX XXX XXX"></label></div>
      <div class="two"><label>Buyer email<input name="byEmail" type="email"></label><label>Recipient email<input name="email" type="email"></label></div>
      <div class="two"><label>Language<select name="lang"><option value="en">English</option><option value="am">አማርኛ</option></select></label><label>Payment note<input name="note" maxlength="60" placeholder="cash, DJ…"></label></div>
      <button class="btn" type="submit" style="min-height:52px">Register — mark as paid</button>
      <div id="newdone"></div>
    </form></details>`;
}
// Banner when the payment checker (the Mac verifier) is off or can't reach telebirr receipts.
function verifierWarning(){
  const v=S.verifier,now=Date.now();
  const waiting=S.orders.filter(o=>o.status==='review'&&now-(o.submittedAt||o.createdAt)>5*60e3);
  const wait=waiting.length?` ${waiting.length} payment${waiting.length>1?'s are':' is'} waiting for you (${waiting.map(o=>esc(o.id)).join(', ')}) — check them in Tasks.`:'';
  if(!v||now-v.seen>3*60e3)return `<b>Payment checker is offline</b>${v?` since ${ago(v.seen)}`:''}. Payments won’t be approved automatically until the Mac is on, awake and online.${wait}`;
  if(v.receipt==='fail'&&now-v.receiptAt<15*60e3)return `<b>Payment checker can’t reach telebirr receipts</b> (${esc(v.err||'no answer')}). On the Mac: turn off Cloudflare WARP / any VPN, and check the internet.${wait}`;
  return '';
}
function render(){
  renderTabs();
  const w=verifierWarning();$('#warn').innerHTML=w?`<div class="warnbar">⚠️ <span>${w}</span></div>`:'';
  const v={dash:viewDash,tasks:viewTasks,orders:viewOrders,inq:viewInq}[S.tab]||viewDash;
  $('#view').innerHTML=v();
}
function setTab(t){S.tab=t;S.sel=null;try{sessionStorage.setItem('dg-tab',t)}catch(e){}render();window.scrollTo(0,0);}
function replaceOrder(o){S.orders=S.orders.map(x=>x.id===o.id?{...x,...o}:x);}

/* ---------- events ---------- */
$('#loginForm').onsubmit=e=>{e.preventDefault();pw=$('#pw').value;load();};
$('#refresh').onclick=()=>load().then(()=>toast('Updated'));
document.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]');if(tab){if(tab.hasAttribute('data-jami'))S.filter='jami';setTab(tab.dataset.tab);return;}
  const fil=e.target.closest('[data-filter]');if(fil){S.filter=fil.dataset.filter;render();return;}
  const tm=e.target.closest('[data-testmail]');if(tm){const to=prompt('Send a test certificate email to:');if(!to)return;tm.disabled=true;
    try{const j=await api('POST',{testEmail:to.trim()});toast('Sent from '+j.from+' — check '+j.to);}catch(err){alert(err.message);}tm.disabled=false;return;}
  const cp=e.target.closest('[data-copytext]');if(cp){const t=cp.dataset.copytext,id=cp.dataset.id,what=cp.dataset.cmark;
    try{await navigator.clipboard.writeText(t);}catch(err){prompt('Copy this:',t);}
    if(what){const o=S.orders.find(x=>x.id===id);if(o)o.follow={...F(o),[what]:Date.now()};api('POST',{id,action:'mark',what}).catch(()=>{});render();toast('Copied — paste it into an SMS. Marked as sent.');}
    else toast('Copied — paste it into an SMS');return;}
  const ed=e.target.closest('[data-edit]');if(ed){S.edit=S.edit===ed.dataset.edit?null:ed.dataset.edit;render();return;}
  if(e.target.closest('[data-addhand]')){const d=document.querySelector('#addhand details');if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'});}return;}
  const row=e.target.closest('tr[data-open]');if(row){S.q=row.dataset.open;S.filter='all';setTab('orders');return;}
  const lb=e.target.closest('[data-lb]');if(lb){S.lb=lb.dataset.lb;render();return;}
  const po=e.target.closest('[data-post]');if(po){const b=leaders(S.lb).boards.find(x=>x.id===po.dataset.post);const t=b&&postText(b,S.lb);
    if(t){try{await navigator.clipboard.writeText(t);toast('Copied — paste it into your post');}catch(err){prompt('Copy this:',t);}}return;}
  const col=e.target.closest('[data-col]');if(col){const i=+col.dataset.col;S.sel=S.sel===i?null:i;render();return;}
  // tapping an SMS / email / call link records the follow-up, then the link opens as normal
  const mk=e.target.closest('a[data-mark]');
  if(mk){const id=mk.dataset.id,what=mk.dataset.mark;const o=S.orders.find(x=>x.id===id);
    const tg=mk.dataset.tgcopy;if(tg){try{navigator.clipboard.writeText(tg).then(()=>toast('Message copied — paste it in the Telegram chat and send'),()=>{});}catch(err){}}
    if(o){o.follow={...F(o),[what]:Date.now()};}
    api('POST',{id,action:'mark',what}).catch(()=>{});
    setTimeout(()=>{render();if(what!=='call'&&!tg)toast('Marked as sent');},700);return;}
  const sk=e.target.closest('[data-skip]');
  if(sk){const id=sk.dataset.id,what=sk.dataset.skip;sk.disabled=true;
    try{const j=await api('POST',{id,action:'mark',what});replaceOrder(j.order);render();toast('Skipped');}catch(err){alert(err.message);sk.disabled=false;}return;}
  const qb=e.target.closest('[data-q]');
  if(qb){qb.disabled=true;try{const j=await api('POST',{inquiry:qb.dataset.q,action:qb.dataset.qa});S.inquiries=S.inquiries.map(q=>q.id===j.inquiry.id?j.inquiry:q);render();}catch(err){alert(err.message);qb.disabled=false;}return;}
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=b.dataset.id,a=b.dataset.a;let note=null;
  if(a==='approve'&&!confirm(`Approve ${id}? The customer can then save the certificate.`))return;
  if(a==='reject'){note=prompt(`Reject ${id}. Message shown to the customer:`,'We could not confirm this payment. Please check the transaction number or call 0996 567 218.');if(note===null)return;}
  if(a==='remove'&&!confirm(`Remove ${id} from the public registry? You can restore it later from the Removed filter.`))return;
  if(a==='restore'&&!confirm(`Put ${id} back in the public registry? Same number, same certificate link.`))return;
  b.disabled=true;
  try{const j=await api('POST',{id,action:a,note});replaceOrder(j.order);render();toast({approve:'Approved',reject:'Rejected',remove:'Removed',restore:'Restored'}[a]||'Done');}
  catch(err){alert(err.message);b.disabled=false;}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener('submit',async e=>{
  const ef=e.target.closest('[data-editform]');
  if(ef){e.preventDefault();const id=ef.dataset.editform,btn=ef.querySelector('button[type=submit]');btn.disabled=true;
    try{const j=await api('POST',{id,action:'edit',edit:Object.fromEntries(new FormData(ef).entries())});replaceOrder(j.order);S.edit=null;render();toast('Saved — certificate updated');}
    catch(err){alert(err.message);btn.disabled=false;}return;}
  if(e.target.id==='baseform'){e.preventDefault();const b=Object.fromEntries(new FormData(e.target).entries());
    if(!confirm(`Restart the money totals at ${b.telebirr} Birr telebirr + ${b.jami} Birr Jami, counting from now?`))return;
    try{const j=await api('POST',{baseline:b});S.baseline=j.baseline;render();toast('Totals restarted');}catch(err){alert(err.message);}return;}
  if(e.target.id!=='newform')return;e.preventDefault();
  const f=e.target,btn=f.querySelector('button[type=submit]');const create=Object.fromEntries(new FormData(f).entries());
  if(!confirm(`Register ${create.to} (from ${create.by}) as PAID and publish it?`))return;
  btn.disabled=true;const out=f.querySelector('#newdone');out.innerHTML='';
  try{const j=await api('POST',{create});const o=j.order;S.orders=[o,...S.orders];
    const box=`<div class="done-box"><strong>${esc(o.id)}</strong> registered for ${esc(o.to)}. <a href="${esc(o.recordLink)}" target="_blank" rel="noopener">Open record ↗</a></div>`;
    render();const n=document.querySelector('#newdone');if(n){n.closest('details').open=true;n.innerHTML=box;}toast('Registered');}
  catch(err){out.innerHTML=`<div class="err">${esc(err.message)}</div>`;btn.disabled=false;}
});
if(pw)load();
setInterval(()=>{if(!$('#app').hidden&&document.visibilityState==='visible'&&!S.edit&&!document.querySelector('details.new[open]')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))load();},60000);
</script>
